{% extends "base.html" %}
{% block title %}Login - DailyCall{% endblock %}

{% block login_content %}
<!-- Added padding-bottom: 10vh to visually lift the center point -->
<div class="d-flex justify-content-center align-items-center bg-white" style="min-height: 100vh; padding-bottom: 10vh;">
    <div style="width: 100%; max-width: 380px; padding: 20px;">
        <div class="text-center mb-5">
            <div class="mx-auto mb-3" style="width: 80px; height: 80px; display: flex; align-items: center; justify-content: center;">
                <img src="https://i.ibb.co/XfTt0XBD/image-removebg-preview-36-1-removebg-preview.png" alt="DailyCall Logo" style="max-width: 100%; max-height: 100%; object-fit: contain;">
            </div>
            <h3 class="fw-bold text-dark">DailyCall</h3>
            <p class="text-muted small">Admin Access</p>
        </div>

        <form method="POST">
            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="Username" required>
            </div>
            <div class="mb-4">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <button class="btn btn-gpt w-100 py-3">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
