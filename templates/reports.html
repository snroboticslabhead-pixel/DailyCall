{% extends "base.html" %}
{% block title %}Reports{% endblock %}

{% block content %}
<div class="d-flex justify-content-center mt-5">
    <div class="col-lg-8 col-xl-7">
        <div class="text-center mb-5">
            <h2 class="fw-bold">Export Data</h2>
            <p class="text-muted">Select date ranges and filters to download CSV reports.</p>
        </div>
        
        <form method="POST">
            <div class="row g-4 mb-4">
                <div class="col-md-6">
                    <label class="form-label">From Date</label>
                    <input type="date" name="date_from" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">To Date</label>
                    <input type="date" name="date_to" class="form-control">
                </div>
            </div>

            <div class="row g-4 mb-5">
                <div class="col-md-6">
                    <label class="form-label">Filter Class (Optional)</label>
                    <select name="class_id" class="form-select">
                        <option value="all">All Classes</option>
                        {% for c in classes %}
                        <option value="{{ c._id }}">{{ c.class_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Filter Section (Optional)</label>
                    <select name="section_id" class="form-select">
                        <option value="all">All Sections</option>
                        {% for s in sections %}
                        <option value="{{ s._id }}">{{ s.section_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="d-grid">
                <button type="submit" name="report_type" value="daywise" class="btn btn-gpt btn-lg">
                    <i class="bi bi-cloud-download me-2"></i> Download Attendance Report
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
